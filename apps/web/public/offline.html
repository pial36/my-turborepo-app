<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Offline · Team Hub</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f8f9fb; color: #101828; padding: 16px; text-align: center;
    }
    @media (prefers-color-scheme: dark) { body { background: #0b0f17; color: #e6e9ef; } p { color: #9aa4b2; } }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
    button {
      background: #4f46e5; color: #fff; border: none; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Team Hub needs a connection to load your workspace. We'll be here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
